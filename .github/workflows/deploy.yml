name: Local In-LXC CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-desa
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy on Target LXC 10025
    runs-on: [self-hosted, linux, x64, desa]

    env:
      APP_DIR: /opt/desa
      APP_PORT: 80

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Sync Source Code to Production Directory
        run: |
          echo ">>> Mensinkronkan file repository ke direktori produksi $APP_DIR..."
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='storage' \
            ./ "$APP_DIR/"

      - name: Build & Launch Docker Container In-Place
        working-directory: /opt/desa
        run: |
          echo ">>> Menjalankan build Docker image lokal..."
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Application Health Check
        run: |
          echo ">>> Menunggu service stabil dan melakukan health check..."
          MAX_RETRIES=20
          COUNT=0
          until curl -fsS http://127.0.0.1:$APP_PORT/up > /dev/null 2>&1; do
            sleep 3
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "❌ Health check gagal setelah $MAX_RETRIES percobaan! Service tidak merespons di port $APP_PORT."
              docker compose -f "$APP_DIR/docker-compose.yml" logs --tail=50
              exit 1
            fi
            echo "Menunggu aplikasi siap ($COUNT/$MAX_RETRIES)..."
          done
          echo "✅ Health check berhasil! Aplikasi berjalan normal di port $APP_PORT."

      - name: Post-Deployment Storage Hygiene
        if: always()
        run: |
          echo ">>> Membersihkan sisa build cache dan dangling images..."
          docker image prune -f
